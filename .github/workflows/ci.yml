name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build y verificacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mostrar mensaje
        run: echo "Pipeline ejecutandose correctamente"

      - name: Verificar que el codigo compile
        run: python -m compileall -q app.py

      - name: Ejecutar build
        run: python app.py

      - name: Correr pruebas
        run: pytest -v
